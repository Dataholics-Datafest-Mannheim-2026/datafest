[package]
name = "data_preprocessing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
heapless = { version = "0.9.2", features = ["serde"] }
polars = { version = "0.*", features = [
  "abs",
  "decompress",
  "fmt",
  "json",
  "lazy",
  "ndarray",
  "rows",
  "serde",
  "serde-lazy",
  "temporal",
  "timezones",
  "zip_with",
] }
serde = "1.0.228"
serde_json = "1.0.149"
